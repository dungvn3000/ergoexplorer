<title>Ergo Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#FAF9F6; --surface-3:#F0EEE8;
  --ink:#1A1916; --muted:#6E6A62; --faint:#9C9890;
  --line:#E3E0D8; --line-strong:#CDC9BF;
  --accent:#E4520F; --accent-ink:#B9400A; --accent-soft:#FBE9DF; --accent-line:#F3C3AD;
  --good:#1C8A57; --good-soft:#E1F3E9;
  --warn:#B8730A; --warn-soft:#FBF0DA;
  --crit:#C23B2B; --crit-soft:#FAE3DF;
  --shadow:0 1px 2px rgba(26,25,22,.06),0 4px 16px rgba(26,25,22,.05);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --surface:#1C1B18; --surface-2:#211F1B; --surface-3:#282620;
    --ink:#ECE9E2; --muted:#A39E94; --faint:#726E65;
    --line:#2D2B26; --line-strong:#403D35;
    --accent:#FF6A2C; --accent-ink:#FF8B5A; --accent-soft:#3A2115; --accent-line:#6A3A22;
    --good:#4CC68A; --good-soft:#15301F;
    --warn:#E0A03A; --warn-soft:#332711;
    --crit:#F0705E; --crit-soft:#3A1A15;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1C1B18; --surface-2:#211F1B; --surface-3:#282620;
  --ink:#ECE9E2; --muted:#A39E94; --faint:#726E65;
  --line:#2D2B26; --line-strong:#403D35;
  --accent:#FF6A2C; --accent-ink:#FF8B5A; --accent-soft:#3A2115; --accent-line:#6A3A22;
  --good:#4CC68A; --good-soft:#15301F;
  --warn:#E0A03A; --warn-soft:#332711;
  --crit:#F0705E; --crit-soft:#3A1A15;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-feature-settings:"tnum" 0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.hash{font-family:var(--mono);font-size:13px;word-break:break-all}
.hash-full{font-family:var(--mono);font-size:12.5px;word-break:break-all;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* ── Header ───────────────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand svg{display:block}
.nav{display:flex;gap:2px;margin-left:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);padding:6px 10px;border-radius:6px;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface-3);text-decoration:none}
.nav a.on{color:var(--ink);background:var(--surface-3)}
.topbar .search{margin-left:auto;flex:1;max-width:460px;min-width:0}
.netpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.netpill i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
@media (max-width:820px){ .topbar .search{display:none} .netpill span{display:none} }

.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--faint);pointer-events:none}
.search input{width:100%;height:38px;padding:0 12px 0 38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13.5px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search.big input{height:52px;font-size:15px;padding-left:46px;background:var(--surface);box-shadow:var(--shadow)}
.search.big svg{left:16px}

/* ── Layout ───────────────────────────── */
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{max-width:1240px;margin:0 auto;padding:36px 20px 28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero .search{width:100%;max-width:760px}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.hero h1{font-size:26px}
.hints{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.hints a{color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.hints a:hover{color:var(--ink);border-color:var(--line-strong);text-decoration:none}

.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.stat .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d.up{color:var(--good)} .stat .d.down{color:var(--crit)}
@media (max-width:1000px){ .stats{grid-template-columns:repeat(3,1fr)} }
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} .stat .v{font-size:17px} }

.grid{display:grid;gap:20px;margin-bottom:20px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c21{grid-template-columns:2fr 1fr}
@media (max-width:900px){ .grid.c2,.grid.c21{grid-template-columns:1fr} }

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{display:flex;align-items:center;gap:8px}
.panel-h .more{font-size:12.5px;font-weight:500}
.panel-b{padding:16px}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}

/* ── Tables ───────────────────────────── */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.num{font-variant-numeric:tabular-nums}
.panel table th:first-child,.panel table td:first-child{padding-left:16px}
.panel table th:last-child,.panel table td:last-child{padding-right:16px}
.panel .tscroll+.panel-f{border-top:0}

/* rows list (home panels) */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row{color:var(--ink)}
.row:hover{background:var(--surface-2);text-decoration:none}
.row .main .t .num{color:var(--accent-ink)}
.row .ico{width:36px;height:36px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;font-family:var(--mono)}
.row .ico.tx{background:var(--accent-soft);color:var(--accent-ink)}
.row .main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row .main .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{text-align:right;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.row .side .t{font-weight:500;white-space:nowrap}
.row .side .s{font-size:12px;color:var(--muted);white-space:nowrap}

/* ── Chips / pills ────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-3);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tok{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px 2px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.tok:hover{border-color:var(--line-strong);text-decoration:none}
.tok i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;font-style:normal}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-3);color:var(--muted);letter-spacing:.03em}
.lbl{display:inline-flex;align-items:center;gap:6px;min-width:0}
.lbl .name{font-weight:500;white-space:nowrap}
.lbl .name.contract{color:var(--accent-ink)}

/* ── Page head ────────────────────────── */
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.crumbs a{color:var(--muted)}
.crumbs .sep{color:var(--faint)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;margin-bottom:20px}
.phead .id{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.phead .id .title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.icon{width:32px;padding:0;justify-content:center}
.copy{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:0;background:transparent;border-radius:5px;color:var(--faint);cursor:pointer;vertical-align:middle;padding:0}
.copy:hover{background:var(--surface-3);color:var(--ink)}
.idline{display:flex;align-items:center;gap:6px;min-width:0}
.idline .hash{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* key/value */
.kv{display:grid;grid-template-columns:180px 1fr;font-size:13px}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv .k{color:var(--muted);padding-right:12px}
.kv .v{word-break:break-all}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
@media (max-width:900px){ .kv2{grid-template-columns:1fr} }
@media (max-width:520px){ .kv{grid-template-columns:1fr} .kv .k{padding:9px 0 0;border-bottom:0} .kv .v{padding-top:2px} }

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:11px 10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .n{font-size:11.5px;color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.tabpane[hidden]{display:none}

/* boxes */
.io{display:grid;grid-template-columns:1fr 32px 1fr;gap:12px;align-items:start}
@media (max-width:900px){ .io{grid-template-columns:1fr} .io .arrow{transform:rotate(90deg);justify-self:center} }
.io .arrow{display:grid;place-items:center;color:var(--faint);padding-top:44px}
.io .arrow svg{display:block}
.iocol{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.iocol .ioh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.iocol .ioh .sum{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.box{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.box:last-child{border-bottom:0}
.box .bh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.box .bh .a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.box .bh .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.box .bm{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);align-items:center}
.box .bm .idx{font-family:var(--mono);color:var(--faint)}
.box .toks{display:flex;flex-wrap:wrap;gap:5px}
.box details{font-size:12px}
.box summary{cursor:pointer;color:var(--muted);user-select:none;list-style:none;display:inline-flex;align-items:center;gap:5px}
.box summary::-webkit-details-marker{display:none}
.box summary::before{content:"";width:0;height:0;border:4px solid transparent;border-left:5px solid var(--faint);margin-left:2px;transition:transform .15s}
.box details[open] summary::before{transform:rotate(90deg)}
.regs{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:11.5px}
.regs .rk{color:var(--accent-ink);font-weight:600}
.regs .rv{color:var(--muted);word-break:break-all}
.regs .rt{color:var(--faint)}

/* tx card in block */
.txcard{border-bottom:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;align-items:start}
.txcard:last-child{border-bottom:0}
.txcard .h{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.txcard .lst{display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:0}
.txcard .lst>div{display:flex;justify-content:space-between;gap:10px;min-width:0}
.txcard .lst .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.txcard .lst .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.txcard .lst .cap{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
@media (max-width:700px){ .txcard{grid-template-columns:1fr} }

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);display:none;font-variant-numeric:tabular-nums}
.chart .tip b{font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center}
.bar .track{height:14px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px 4px 4px 3px;opacity:.85}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* pager */
.panel-f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pager{display:flex;gap:4px;align-items:center}
.pager .cur{padding:0 8px;font-variant-numeric:tabular-nums}

/* address balance */
.balance{display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end}
.balance .big{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.balance .big small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.balance .sub{font-size:12.5px;color:var(--muted)}
.qr{width:96px;height:96px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;flex:none}
.qr svg{display:block;width:100%;height:100%}
.dir{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.dir.in{background:var(--good-soft);color:var(--good)}
.dir.out{background:var(--surface-3);color:var(--muted)}
.dir.self{background:var(--warn-soft);color:var(--warn)}

.tokicon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.foot{max-width:1240px;margin:0 auto;padding:24px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.errbox{max-width:560px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.errbox .code{font-family:var(--mono);color:var(--faint);font-size:12px}
.sample{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:4px}
</style>

<div id="app"></div>
<div class="toast" id="toast">Copied</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Sample chain data — deterministic, seeded, generated on load.
   Everything here is placeholder data shaped like Ergo mainnet.
   ═══════════════════════════════════════════════════════════════ */
const NANO = 1e9;
const TIP = 1548210;
const NOW = Date.now() - 41000;              // tip block was ~41s ago
const MAX_SUPPLY = 97739924;
const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

function rng(seed){ let s = (seed >>> 0) || 7; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
function seedOf(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hex(r, n){ let s = ''; for (let i = 0; i < n; i++) s += '0123456789abcdef'[r() * 16 | 0]; return s; }
function b58(r, n, first){ let s = first || ''; while (s.length < n) s += B58[r() * 58 | 0]; return s; }
function pick(r, arr){ return arr[r() * arr.length | 0]; }

const POOLS = [

];

// well-known addresses shown with a label
const LABELS = {};
function label(addr, name, contract){ LABELS[addr] = { name, contract: !!contract }; }
POOLS.forEach(p => label(p.address, p.name + ' payout'));
const KNOWN = [
  ['SigmaUSD bank', true], ['Spectrum ERG/SigUSD pool', true], ['Rosen bridge lock', true],
  ['Ergo Foundation treasury', true], ['Re-emission contract', true], ['ErgoDEX order', true],
  ['Mining fee contract', true],
];
KNOWN.forEach(([n, c]) => { const r = rng(seedOf('known:' + n)); const a = b58(r, 62, c ? pick(r, ['2i', '3W', '4M', '5H']) : '9'); label(a, n, c); });
const knownAddr = name => Object.keys(LABELS).find(a => LABELS[a].name === name);
const EMISSION_ADDR = knownAddr('Re-emission contract');
const FEE_ADDR = knownAddr('Mining fee contract');

// ── blocks ─────────────────────────────
const blocks = [];      // newest first, index 0 = tip
const byId = {}, byHeight = {};
(function genBlocks(){
  let ts = NOW;
  let diff = 1.612e15;
  for (let i = 0; i < 400; i++){
    const h = TIP - i;
    const r = rng(seedOf('blk:' + h));
    const txCount = i === 3 ? 1 : 1 + Math.floor(r() * r() * 48);
    const pool = pickPool(r);
    const size = 780 + Math.round(txCount * (420 + r() * 1400));
    const fees = Math.round(txCount * 1100000 * (1 + r() * 1.8));
    const b = {
      height: h, id: hex(r, 64), parentId: null, timestamp: ts, txCount, size,
      miner: pool, minerAddress: pool.address, difficulty: diff, nBits: 0x1c5a7c6a + (r() * 900000 | 0),
      reward: 18 * NANO, fees, votes: r() < 0.08 ? '8,0,0' : '0,0,0', version: 3,
      stateRoot: hex(r, 66), txRoot: hex(r, 64), adRoot: hex(r, 64), extHash: hex(r, 64),
      pow: { pk: '02' + hex(r, 64), w: '02' + hex(r, 64), n: hex(r, 16), d: 0 },
    };
    blocks.push(b); byId[b.id] = b; byHeight[h] = b;
    ts -= Math.round(1000 * (35 + r() * 190));
    diff *= 1 + (r() - 0.5) * 0.004;
  }
  blocks.forEach((b, i) => { b.parentId = blocks[i + 1] ? blocks[i + 1].id : hex(rng(seedOf('blk:' + (b.height - 1))), 64); });
})();

function getBlock(key){
  if (/^\d+$/.test(key)){ const h = +key; if (byHeight[h]) return byHeight[h]; if (h <= TIP && h > 0) return synthBlock(h); return null; }
  if (byId[key]) return byId[key];
  if (/^[0-9a-f]{64}$/.test(key)) return synthBlock(TIP - 400 - (seedOf(key) % 900000), key);
  return null;
}
function synthBlock(h, id){
  const r = rng(seedOf('blk:' + h));
  const txCount = 1 + Math.floor(r() * r() * 48), pool = pickPool(r);
  const b = { height: h, id: id || hex(r, 64), parentId: hex(r, 64), timestamp: NOW - (TIP - h) * 121000, txCount,
    size: 780 + Math.round(txCount * (420 + r() * 1400)), miner: pool, minerAddress: pool.address, difficulty: 1.58e15,
    nBits: 0x1c5a7c6a, reward: 18 * NANO, fees: Math.round(txCount * 1100000 * 1.6), votes: '0,0,0', version: 3,
    stateRoot: hex(r, 66), txRoot: hex(r, 64), adRoot: hex(r, 64), extHash: hex(r, 64),
    pow: { pk: '02' + hex(r, 64), w: '02' + hex(r, 64), n: hex(r, 16), d: 0 } };
  byId[b.id] = b; byHeight[h] = b; return b;
}

// ── transactions ───────────────────────
const txCache = {};
function blockTxs(b){
  if (b.txs) return b.txs;
  const r = rng(seedOf('txs:' + b.id));
  const list = [];
  for (let i = 0; i < b.txCount; i++){
    const id = hex(r, 64);
    list.push(makeTx(id, b, i, r));
  }
  b.txs = list; return list;
}
function makeTx(id, b, index, r){
  r = r || rng(seedOf('tx:' + id));
  const coinbase = index === b.txCount - 1;   // Ergo puts the emission/reward tx last
  const tx = { id, blockId: b.id, height: b.height, timestamp: b.timestamp, index, inputs: [], dataInputs: [], outputs: [], coinbase };
  const rb = rng(seedOf('box:' + id));
  if (coinbase){
    const emission = 30 * NANO;
    tx.inputs.push(mkBox(rb, EMISSION_ADDR, 7_200_000 * NANO - (b.height - 777_000) * 3 * NANO, [], b.height - 1));
    tx.outputs.push(mkBox(rb, EMISSION_ADDR, tx.inputs[0].value - emission, [], b.height));
    tx.outputs.push(mkBox(rb, b.minerAddress, 18 * NANO, [], b.height));
    tx.outputs.push(mkBox(rb, knownAddr('Re-emission contract'), 12 * NANO, [], b.height));
    tx.fee = 0; tx.size = 412;
    tx.kind = 'Block reward';
  } else {
    const kind = pick(rb, ['Transfer', 'Transfer', 'Transfer', 'Token transfer', 'Token transfer', 'DEX swap', 'Bank mint', 'Bridge lock', 'Consolidation']);
    tx.kind = kind;
    const nIn = 1 + Math.floor(rb() * rb() * 5), nOut = 2 + Math.floor(rb() * rb() * 4);
    let total = 0;
    const from = rb() < .2 ? pickPool(rb).address : b58(rb, 51, '9');
    const toks = kind === 'Transfer' || kind === 'Consolidation' ? [] : sampleTokens(rb, kind === 'DEX swap' ? 2 : 1);
    for (let i = 0; i < nIn; i++){ const v = Math.round(NANO * (0.05 + Math.pow(rb(), 3) * 4000)); total += v; tx.inputs.push(mkBox(rb, from, v, toks, b.height - 1 - (rb() * 5000 | 0))); }
    tx.fee = Math.round(1100000 * (1 + (rb() < .3 ? rb() * 2 : 0)));
    let rem = total - tx.fee;
    const dest = kind === 'DEX swap' ? knownAddr('Spectrum ERG/SigUSD pool') : kind === 'Bank mint' ? knownAddr('SigmaUSD bank') : kind === 'Bridge lock' ? knownAddr('Rosen bridge lock') : b58(rb, 51, '9');
    const amt = Math.round(rem * (0.1 + rb() * 0.8));
    tx.outputs.push(mkBox(rb, dest, amt, toks, b.height, LABELS[dest] && LABELS[dest].contract));
    rem -= amt;
    for (let i = 2; i < nOut; i++){ const v = Math.round(rem * rb() * 0.3); rem -= v; tx.outputs.push(mkBox(rb, b58(rb, 51, '9'), v, [], b.height)); }
    tx.outputs.push(mkBox(rb, from, rem, [], b.height));            // change
    tx.outputs.push(mkBox(rb, FEE_ADDR, tx.fee, [], b.height, true)); // miner fee box
    if (kind === 'DEX swap' || kind === 'Bank mint') tx.dataInputs.push(mkBox(rb, knownAddr(kind === 'DEX swap' ? 'Spectrum ERG/SigUSD pool' : 'SigmaUSD bank'), 1_500 * NANO, [], b.height - 40, true));
    tx.size = 250 + tx.inputs.length * 110 + tx.outputs.length * 95 + (toks.length ? 60 : 0);
  }
  tx.outputs.forEach((o, i) => { o.index = i; o.spent = i < tx.outputs.length - 1 && rb() < (TIP - b.height) / 400; if (o.spent) o.spentBy = hex(rb, 64); });
  tx.inputs.forEach((o, i) => { o.index = i; });
  txCache[id] = tx; return tx;
}
function mkBox(r, address, value, assets, creationHeight, contract){
  const isContract = contract || (LABELS[address] && LABELS[address].contract);
  const b = { boxId: hex(r, 64), address, value, assets: assets.map(a => ({ ...a })), creationHeight,
    ergoTree: isContract ? '1005' + hex(r, 180) : '0008cd' + hex(r, 66), registers: {} };
  if (assets.length && r() < .7){ b.registers.R4 = { type: 'Coll[Byte]', raw: '0e' + hex(r, 24), render: '"' + pick(r, ['refund', 'order:erg-sigusd', 'lp-deposit', 'batch#' + (r()*9000|0)]) + '"' }; }
  if (isContract){ b.registers.R5 = { type: 'Long', raw: '05' + hex(r, 8), render: String(Math.round(r() * 5e7)) }; b.registers.R6 = { type: 'Int', raw: '04' + hex(r, 4), render: String(r()*1000|0) }; }
  return b;
}
function sampleTokens(r, n){
  const out = []; const used = new Set();
  while (out.length < n){ const t = pick(r, TOKENS); if (used.has(t.id)) continue; used.add(t.id);
    out.push({ tokenId: t.id, name: t.name, decimals: t.dec, amount: Math.round(Math.pow(10, t.dec) * (1 + Math.pow(r(), 2) * 50000)) }); }
  return out;
}
function getTx(id){
  if (txCache[id]) return txCache[id];
  if (!/^[0-9a-f]{64}$/.test(id)) return null;
  // not one we generated for a listed block: park it in a recent block
  const b = blocks[seedOf(id) % 380 + 5];
  return makeTx(id, b, seedOf(id) % Math.max(1, b.txCount - 1));
}
function recentTxs(n){
  const out = [];
  for (const b of blocks){ let k = 0; for (const t of blockTxs(b)){ if (t.coinbase || k >= 3) continue; out.push(t); k++; if (out.length >= n) return out; } }
  return out;
}

// ── mempool ────────────────────────────
const mempool = (() => {
  const r = rng(seedOf('mempool'));
  const fake = { id: 'mempool', height: TIP + 1, timestamp: NOW, txCount: 999, minerAddress: POOLS[0].address };
  const list = [];
  for (let i = 0; i < 37; i++){ const id = hex(r, 64); const t = makeTx(id, fake, i, r); t.timestamp = NOW + 41000 - Math.round(r() * 300000); t.pending = true; t.blockId = null; t.height = null; list.push(t); }
  return list.sort((a, b) => b.timestamp - a.timestamp);
})();

// ── address ────────────────────────────
function getAddress(a){
  if (!/^[1-9A-HJ-NP-Za-km-z]{40,}$/.test(a)) return null;
  const r = rng(seedOf('addr:' + a));
  const lb = LABELS[a];
  const pool = POOLS.find(p => p.address === a);
  const contract = lb ? lb.contract : !a.startsWith('9');
  const balance = pool ? Math.round(NANO * (2000 + r() * 40000)) : contract ? Math.round(NANO * (50000 + r() * 900000)) : Math.round(NANO * Math.pow(r(), 2) * 12000);
  const tokens = sampleTokens(r, contract ? 3 : Math.floor(r() * 4)).map(t => ({ ...t, amount: t.amount * (1 + (r() * 40 | 0)) }));
  const txCount = pool ? 30000 + (r() * 90000 | 0) : contract ? 80000 + (r() * 500000 | 0) : 1 + (r() * r() * 900 | 0);
  const txs = [];
  const n = Math.min(txCount, 20);
  for (let i = 0; i < n; i++){
    const b = blocks[Math.min(399, (r() * r() * 400) | 0)];
    const dir = pool ? 'in' : pick(r, ['in', 'out', 'out', 'self']);
    const amt = pool ? 18 * NANO : Math.round(NANO * Math.pow(r(), 2) * 900);
    txs.push({ id: hex(r, 64), height: b.height, timestamp: b.timestamp, dir, amount: dir === 'out' ? -amt : amt, tokens: r() < .3 ? sampleTokens(r, 1) : [], fee: 1100000 });
  }
  txs.sort((x, y) => y.height - x.height);
  const ergoTree = contract ? '1005' + hex(r, 200) : '0008cd' + hex(r, 66);
  return { address: a, label: lb, contract, balance, unconfirmed: r() < .15 ? Math.round(NANO * r() * 5) : 0, tokens, txCount, txs, ergoTree,
    firstSeen: NOW - Math.round(r() * 3e10), lastSeen: txs[0] ? txs[0].timestamp : NOW, boxes: 1 + (r() * (contract ? 2000 : 12) | 0) };
}

// ── charts data ────────────────────────
const hashrate30 = (() => { const r = rng(seedOf('hr')); let v = 11.9; const out = []; for (let i = 29; i >= 0; i--){ v = Math.max(9.5, Math.min(15.5, v + (r() - 0.48) * 0.6)); out.push({ day: NOW - i * 864e5, v: +v.toFixed(2) }); } out[29].v = 12.84; return out; })();
const pool24 = (() => { const r = rng(seedOf('p24')); const total = 712; return POOLS.map(p => ({ name: p.name, n: Math.round(total * p.w * (0.9 + r() * 0.2)) })).sort((a, b) => b.n - a.n); })();

   Formatting
   ═══════════════════════════════════════════════════════════════ */
const fmtInt = n => n.toLocaleString('en-US');
function erg(nano, maxDec){ const v = nano / NANO; return v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: maxDec == null ? 9 : maxDec }); }
function ergHtml(nano, maxDec){ return `<span class="num">${erg(nano, maxDec)}</span> <span class="muted">ERG</span>`; }
function tokAmt(t){ return (t.amount / Math.pow(10, t.decimals)).toLocaleString('en-US', { maximumFractionDigits: t.decimals }); }
function bytes(n){ return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; }
function short(h, a = 8, b = 6){ return h.length <= a + b + 1 ? h : h.slice(0, a) + '…' + h.slice(-b); }
function ago(ts){ const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); if (s < 60) return s + 's ago'; const m = s / 60 | 0; if (m < 60) return m + 'm ago'; const h = m / 60 | 0; if (h < 48) return h + 'h ' + (m % 60) + 'm ago'; return (h / 24 | 0) + 'd ago'; }
function pad(n){ return String(n).padStart(2, '0'); }
function fmtDate(ts){ const d = new Date(ts); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`; }
function fmtSci(n){ return (n / 1e15).toFixed(3) + ' P'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    <div class="phead"><div class="id">

      <div class="idline"><span class="hash">${t.id}</span>${copyBtn(t.id)}</div>
    </div></div>
    <div class="panel" style="margin-bottom:20px"><div class="panel-b"><div class="kv2">
      <div class="kv">
        ${kv('Description', esc(t.desc))}
        ${kv('Total supply', `<span class="num">${tokAmt(tk(t.supply))}</span> <span class="muted">${esc(t.name)}</span>`)}
        ${kv('Holders', `<span class="num">${fmtInt(200 + (r() * 30000 | 0))}</span>`)}
      </div>
      <div class="kv">
        ${kv('Issued in', `${txLink(issueTx, 10, 8)} <span class="muted">· block ${fmtInt(issueH)}</span>`)}
        ${kv('Issuing box', `<span class="mono">${short(issueBox, 10, 8)}</span>${copyBtn(issueBox)}`)}
        ${kv('Standard', 'EIP-4 · name in R4, description R5, decimals R6')}
      </div>
    </div></div></div>
    <div class="grid c2">
      <div class="panel"><div class="panel-h"><h2>Top holders</h2></div><div class="tscroll"><table><thead><tr><th>#</th><th>Address</th><th class="r">Amount</th><th class="r">Share</th></tr></thead>
        <tbody>${holders.map((h, i) => `<tr><td class="muted num">${i + 1}</td><td>${addrLink(h.a, { a: 10, b: 6 })}</td><td class="r num">${tokAmt(tk(h.amt))}</td><td class="r num muted">${(h.amt / t.supply * 100).toFixed(2)}%</td></tr>`).join('')}</tbody></table></div></div>
      <div class="panel"><div class="panel-h"><h2>Recent transfers</h2></div><div class="tscroll"><table><thead><tr><th>Transaction</th><th>Block</th><th>To</th><th class="r">Amount</th></tr></thead>
        <tbody>${transfers.map(x => `<tr><td>${txLink(x.id, 8, 6)}<div class="muted" style="font-size:11.5px">${ago(x.ts)}</div></td><td>${blockLink({ height: x.height })}</td><td>${addrLink(x.to, { a: 8, b: 5 })}</td><td class="r num">${tokAmt(tk(x.amt))}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
  </main>`;
}

function viewMempool(){
  const size = mempool.reduce((s, t) => s + t.size, 0), fees = mempool.reduce((s, t) => s + t.fee, 0);
  return `<main class="wrap">
    <div class="crumbs"><a href="#/">Home</a><span class="sep">/</span>Mempool</div>
    <div class="phead"><div class="id"><div class="title"><h1>Mempool</h1><span class="pill warn">${mempool.length} unconfirmed</span></div><div class="muted">Transactions seen by the node but not yet included in a block · next block expected in ~${Math.max(5, 120 - Math.round((Date.now() - NOW) / 1000))}s</div></div></div>
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat"><div class="k">Pending</div><div class="v">${mempool.length}<small>tx</small></div><div class="d">oldest ${ago(mempool[mempool.length - 1].timestamp)}</div></div>
      <div class="stat"><div class="k">Size</div><div class="v">${bytes(size)}</div><div class="d">of 512 KB block limit</div></div>
      <div class="stat"><div class="k">Fees waiting</div><div class="v">${erg(fees, 4)}<small>ERG</small></div><div class="d">median ${erg(1100000, 4)} ERG</div></div>
      <div class="stat"><div class="k">Fee rate</div><div class="v">1.1<small>µERG/B</small></div><div class="d">min relay 1.0 µERG/B</div></div>

    <div class="panel"><div class="tscroll"><table>

      <tbody>${mempool.map(t => `<tr><td>${txLink(t.id, 14, 10)}</td><td class="muted">${ago(t.timestamp)}</td><td>${kindPill(t.kind)}</td><td class="r num">${t.inputs.length} → ${t.outputs.length}</td><td class="r num">${erg(t.outputs.reduce((s, o) => s + o.value, 0), 4)} ERG</td><td class="r num">${erg(t.fee, 4)}</td><td class="r num muted">${bytes(t.size)}</td></tr>`).join('')}</tbody>

function viewStub(title, body){
  return `<main class="wrap"><div class="crumbs"><a href="#/">Home</a><span class="sep">/</span>${title}</div><div class="phead"><div class="id"><div class="title"><h1>${title}</h1><span class="pill neutral">Mockup placeholder</span></div></div></div><div class="panel"><div class="panel-b">${body}</div></div></main>`;
}
function notFound(kind, key){
  return `<main class="wrap"><div class="errbox"><h1>No ${kind} found</h1><div class="muted">Nothing on mainnet matches this ${kind} identifier. Check for typos or try searching again.</div><div class="code">${esc(key)}</div><a class="btn" href="#/">Back to home</a></div></main>`;
}

/* ═══════════════════════════════════════════════════════════════
   Sparkline
   ═══════════════════════════════════════════════════════════════ */
function drawSpark(){
  const el = document.getElementById('spark'); if (!el) return;
  const W = Math.max(280, el.clientWidth), H = 170, L = 40, R = 12, T = 14, B = 26;
  const data = hashrate30;
  const min = Math.floor(Math.min(...data.map(d => d.v)) - 0.5), max = Math.ceil(Math.max(...data.map(d => d.v)) + 0.5);
  const x = i => L + i * (W - L - R) / (data.length - 1);
  const y = v => T + (max - v) * (H - T - B) / (max - min);
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d.v).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  const area = line + ` L${x(data.length - 1).toFixed(1)},${(H - B).toFixed(1)} L${L},${(H - B).toFixed(1)} Z`;
  const ticks = []; for (let v = min; v <= max; v += (max - min) > 4 ? 2 : 1) ticks.push(v);
  const days = [0, 7, 14, 21, 29];
  const dl = ts => { const d = new Date(ts); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  const last = data[data.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Network hashrate, last 30 days">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v}</text>`).join('')}
    ${days.map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${dl(data[i].day)}</text>`).join('')}
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(data.length - 1)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <g id="xh" style="display:none"><line y1="${T}" y2="${H - B}" stroke="var(--line-strong)" stroke-dasharray="3 3"/><circle r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/></g>
  </svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), xh = el.querySelector('#xh'), tip = el.querySelector('.tip');
  svg.addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect(); const px = (e.clientX - rect.left) * W / rect.width;
    const i = Math.max(0, Math.min(data.length - 1, Math.round((px - L) / ((W - L - R) / (data.length - 1)))));
    xh.style.display = ''; xh.querySelector('line').setAttribute('x1', x(i)); xh.querySelector('line').setAttribute('x2', x(i));
    xh.querySelector('circle').setAttribute('cx', x(i)); xh.querySelector('circle').setAttribute('cy', y(data[i].v));
    tip.style.display = 'block'; tip.style.left = (x(i) * rect.width / W) + 'px'; tip.style.top = (y(data[i].v) * rect.height / H) + 'px';
    tip.innerHTML = `<b>${data[i].v.toFixed(2)} TH/s</b> · ${dl(data[i].day)}`;
  });
  svg.addEventListener('mouseleave', () => { xh.style.display = 'none'; tip.style.display = 'none'; });
}

/* ═══════════════════════════════════════════════════════════════
   Router
   ═══════════════════════════════════════════════════════════════ */
function parseHash(){
  const h = (location.hash || '#/').slice(1);
  const [path, qs] = h.split('?');
  const q = {}; (qs || '').split('&').forEach(p => { if (!p) return; const [k, v] = p.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { path: path || '/', q };
}
function render(){
  const { path, q } = parseHash();
  const seg = path.split('/').filter(Boolean);
  let body;
  if (path === '/') body = viewHome();
  else if (seg[0] === 'blocks') body = viewBlocks(q);
  else if (seg[0] === 'block' && seg[1]) body = viewBlock(seg[1], q);
  else if (seg[0] === 'tx' && seg[1]) body = viewTx(seg[1]);
  else if (seg[0] === 'address' && seg[1]) body = viewAddress(seg[1]);
  else if (seg[0] === 'tokens') body = viewTokens();
  else if (seg[0] === 'token' && seg[1]) body = viewToken(seg[1]);
  else if (seg[0] === 'mempool') body = viewMempool();
  else if (seg[0] === 'charts') body = viewStub('Charts', '<p class="muted">Planned: hashrate, difficulty, block size, transactions per day, fees per day, active addresses, token transfers. Each chart gets a 24h / 7d / 30d / 1y / all range control and a table view.</p>');
  else if (seg[0] === 'api') body = viewStub('API', `<p>The explorer backend exposes a REST API mirroring the Ergo Explorer v1 endpoints.</p><div class="regs" style="margin-top:12px">${['GET /api/v1/blocks', 'GET /api/v1/blocks/{id}', 'GET /api/v1/transactions/{id}', 'GET /api/v1/addresses/{address}/balance/total', 'GET /api/v1/addresses/{address}/transactions', 'GET /api/v1/boxes/{boxId}', 'GET /api/v1/tokens/{tokenId}', 'GET /api/v1/mempool/transactions', 'GET /api/v1/networkState', 'GET /api/v1/info'].map(e => `<span class="rk">${e.split(' ')[0]}</span><span class="rv">${e.split(' ')[1]}</span>`).join('')}</div>`);
  else body = notFound('page', path);
  document.getElementById('app').innerHTML = header(path) + body + footer();
  window.scrollTo(0, 0);
  drawSpark();
}
window.addEventListener('hashchange', render);
window.addEventListener('resize', () => { if (document.getElementById('spark')) drawSpark(); });

// search — height, address, tx / block id, token id
function doSearch(q){
  q = q.trim();
  if (!q) return;
  if (/^\d+$/.test(q)) return location.hash = '#/block/' + q;
  if (tokById[q]) return location.hash = '#/token/' + q;
  if (/^[0-9a-f]{64}$/i.test(q)){ const id = q.toLowerCase(); return location.hash = (byId[id] ? '#/block/' : '#/tx/') + id; }
  if (/^[1-9A-HJ-NP-Za-km-z]{40,}$/.test(q)) return location.hash = '#/address/' + q;
  const t = TOKENS.find(t => t.name.toLowerCase() === q.toLowerCase()); if (t) return location.hash = '#/token/' + t.id;
  location.hash = '#/search/' + encodeURIComponent(q);
}
document.addEventListener('submit', e => { const f = e.target.closest('[data-search]'); if (!f) return; e.preventDefault(); doSearch(f.querySelector('input').value); });
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c){ const v = c.getAttribute('data-copy'); (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.resolve()).catch(() => {}); const t = document.getElementById('toast'); t.textContent = 'Copied ' + short(v, 6, 4); t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1400); return; }
  const tb = e.target.closest('[data-tab]');
  if (tb){ const root = tb.closest('.panel'); root.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tb)); root.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== tb.dataset.tab); }
});
render();
</script>
